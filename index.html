<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gastos Igna</title>
<style>html,body{margin:0;min-height:100%;background:#f4f5f2;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.loading{padding:28px;text-align:center;color:#446b5b;font-weight:700}</style>
</head>
<body>
<div class="loading">Cargando Gastos Igna…</div>
<script>
fetch('base.html',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('No se pudo cargar la app');return r.text()})
  .then(html=>{
    document.open();
    document.write(html);
    document.close();
    const extra=document.createElement('script');
    extra.src='extras.js?v=4';
    document.body.appendChild(extra);
  })
  .catch(()=>{document.body.innerHTML='<div class="loading">No se pudo cargar la app. Actualiza la página.</div>'});
</script>
</body>
</html>
